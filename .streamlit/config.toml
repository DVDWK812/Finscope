[browser]
gatherUsageStats = false

[server]
headless = true
maxUploadSize = 1
# Source watching probes Transformers' optional vision modules.
# Restart the local app after Python source changes.
fileWatcherType = "none"

[theme]
primaryColor = "#70d6c0"
base = "dark"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#17263a"
textColor = "#e7edf6"

[theme.sidebar]
backgroundColor = "#111d2e"
secondaryBackgroundColor = "#17263a"
textColor = "#e7edf6"
