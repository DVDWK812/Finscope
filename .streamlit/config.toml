[browser]
gatherUsageStats = false

[server]
headless = true
maxUploadSize = 1
# Main serves only the lightweight public showcase, so source watching is safe.
# The local product/runtime is maintained separately on the local branch.
fileWatcherType = "auto"

[theme]
base = "dark"
primaryColor = "#27685e"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#17263a"
textColor = "#e7edf6"
font = "sans serif"
